name: Coleta de preços

on:
  schedule:
    # 08:00, 11:00, 14:00, 17:00, 20:00 e 23:00 (horário de Brasília, UTC-3)
    - cron: "0 11,14,17,20,23,2 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx --workspace=packages/scraper playwright install --with-deps chromium

      - name: Gerar Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar migrações do banco
        run: npx --workspace=packages/db prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Coletar preços das lojas
        run: npm run --workspace=packages/scraper ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Surya Dental blocks datacenter/cloud IPs (Akamai bot manager), so it can't run on
  # GitHub-hosted runners. This job targets a self-hosted runner on a residential
  # network instead. It's independent of the "scrape" job above — if the self-hosted
  # runner is offline, only this job is affected, not the 5 stores that scrape reliably
  # from GitHub-hosted runners.
  scrape-surya:
    runs-on: [self-hosted, umbrel, surya]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx --workspace=packages/scraper playwright install --with-deps chromium

      - name: Gerar Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SURYA }}

      - name: Coletar preços da Surya Dental
        run: npm run --workspace=packages/scraper ingest:surya
        env:
          # Uses a separate connection string with an explicit Neon endpoint override
          # (?options=endpoint=...). The self-hosted runner's Docker network doesn't
          # negotiate SNI-based endpoint routing the way GitHub-hosted runners and
          # Vercel do, so plain DATABASE_URL times out here even though it works
          # everywhere else — and the override caused the opposite problem there, so
          # the two are kept as separate secrets rather than one shared value.
          DATABASE_URL: ${{ secrets.DATABASE_URL_SURYA }}

  # Price-drop emails are sent from the self-hosted runner too, via Gmail's SMTP
  # relay (a home/residential IP can't deliver mail directly — most providers
  # reject or spam-filter it — so this rides on Gmail's sending reputation
  # instead of a third-party transactional email API). Runs after "scrape" so it
  # checks against freshly collected prices; doesn't depend on "scrape-surya"
  # since that job is best-effort and shouldn't block alert checks if it fails.
  check-alerts:
    needs: scrape
    runs-on: [self-hosted, umbrel]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Verificar alertas de preço
        run: npm run --workspace=packages/scraper check-alerts
        env:
          # Same DB secret used by scrape-surya — see the comment on that job for why
          # this runner needs the Neon endpoint override that other runners don't.
          DATABASE_URL: ${{ secrets.DATABASE_URL_SURYA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
